app:
  name: nginx-custom-dockerfile
  namespace: samples
  build:
    docker:
      dockerfile: dockerfile
      context: .
  resources:
    cpu: 1
    memory: 64
  expose:
    public:
      port: 80
      connection-tracking: connection-aware
      external:
        protocol: https
  mode:
    flash:
      strategy:
        listen-on-port: 80
